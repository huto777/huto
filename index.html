<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Hűtőkészlet</title>

  <style>
    :root {
      --bg: #10141c;
      --panel: #1a2230;
      --panel2: #242e3d;
      --text: #f1f5fb;
      --muted: #9ba9bb;
      --blue: #4b9cff;
      --red: #ff6868;
      --green: #63d99a;
      --border: #344154;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 18px;
      padding-bottom: 100px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 720px;
      margin: auto;
    }

    h1 {
      margin: 8px 0 5px;
      font-size: 28px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 22px;
    }

    input, select, button {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px;
      font-size: 16px;
    }

    input, select {
      color: var(--text);
      background: var(--panel);
    }

    button {
      background: var(--blue);
      color: #071322;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .search {
      margin-bottom: 16px;
    }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .filters select {
      min-width: 0;
    }

    .product {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .product-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .product-name {
      font-size: 18px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .number {
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .details {
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .expiry {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 7px;
      font-weight: bold;
      margin-top: 8px;
      font-size: 13px;
    }

    .expired {
      color: #fff;
      background: #b92e3a;
    }

    .soon {
      color: #fff;
      background: #176bd1;
    }

    .medium {
      color: #102417;
      background: #63d99a;
    }

    .normal {
      color: #dce4ee;
      background: #364253;
    }

    .empty, .message {
      padding: 18px;
      background: var(--panel);
      border-radius: 12px;
      color: var(--muted);
      text-align: center;
      margin-top: 12px;
      overflow-wrap: anywhere;
    }

    .message.error {
      color: #ff8585;
    }

    .message.success {
      color: var(--green);
    }

    .add-button {
      position: fixed;
      right: 22px;
      bottom: 22px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      font-size: 32px;
      padding: 0;
      box-shadow: 0 4px 20px #0008;
      z-index: 5;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #000b;
      padding: 16px;
      overflow-y: auto;
    }

    .modal.open {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      width: 100%;
      max-width: 480px;
      max-height: 95vh;
      overflow-y: auto;
    }

    .modal h2 {
      margin-top: 0;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 14px;
    }

    .actions {
      display: flex;
      gap: 9px;
      margin-top: 18px;
    }

    .actions button {
      flex: 1;
    }

    .secondary {
      background: var(--panel2);
      color: var(--text);
    }

    .danger {
      background: #b92e3a;
      color: white;
    }

    #delete-button {
      margin-top: 10px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 420px) {
      body { padding: 12px; padding-bottom: 95px; }
      h1 { font-size: 25px; }
      .filters { flex-direction: column; }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>🧊 Hűtőkészlet</h1>
    <div class="subtitle">Közös családi készlet</div>

    <input
      id="search"
      class="search"
      type="search"
      placeholder="Keresés név vagy sorszám alapján…"
      autocomplete="off"
    >

    <div class="filters">
      <select id="category-filter" aria-label="Kategória szűrése">
        <option value="">Minden kategória</option>
        <option>Tejtermék</option>
        <option>Hús, hal</option>
        <option>Zöldség, gyümölcs</option>
        <option>Pékáru</option>
        <option>Ital</option>
        <option>Konzerv</option>
        <option>Fagyasztott</option>
        <option>Egyéb</option>
      </select>

      <select id="sort-filter" aria-label="Rendezés">
        <option value="expiry">Lejárat szerint</option>
        <option value="number">Sorszám szerint</option>
        <option value="name">Név szerint</option>
      </select>
    </div>

    <div id="status" class="message">Készlet betöltése…</div>
    <div id="products"></div>
  </main>

  <button id="add-button" class="add-button" aria-label="Termék hozzáadása">+</button>

  <div id="editor" class="modal">
    <section class="modal-content">
      <h2 id="editor-title">Új termék</h2>

      <form id="product-form">
        <div class="field">
          <label for="product-number">Sorszám</label>
          <input id="product-number" type="number" min="1" step="1" required>
        </div>

        <div class="field">
          <label for="product-name">Termék neve</label>
          <input id="product-name" maxlength="120" required>
        </div>

        <div class="field">
          <label for="expiry-date">Lejárati dátum</label>
          <input id="expiry-date" type="date" required>
        </div>

        <div class="field">
          <label for="product-category">Kategória</label>
          <select id="product-category" required>
            <option>Tejtermék</option>
            <option>Hús, hal</option>
            <option>Zöldség, gyümölcs</option>
            <option>Pékáru</option>
            <option>Ital</option>
            <option>Konzerv</option>
            <option>Fagyasztott</option>
            <option>Egyéb</option>
          </select>
        </div>

        <div id="form-message" class="message hidden"></div>

        <div class="actions">
          <button type="submit" id="save-button">Mentés</button>
          <button type="button" id="cancel-editor" class="secondary">Mégse</button>
        </div>

        <button type="button" id="delete-button" class="danger hidden">
          Termék törlése
        </button>
      </form>
    </section>
  </div>

  <script>
    const API =
      "https://tvotoadiuakjjxsqrexi.supabase.co/functions/v1/smooth-processor";

    const CATEGORIES = [
      "Tejtermék",
      "Hús, hal",
      "Zöldség, gyümölcs",
      "Pékáru",
      "Ital",
      "Konzerv",
      "Fagyasztott",
      "Egyéb"
    ];

    const $ = id => document.getElementById(id);

    let products = [];
    let editingId = null;
    let loading = false;

    function showStatus(message, type = "") {
      $("status").textContent = message;
      $("status").className = "message " + type;
    }

    function showFormMessage(message, type = "error") {
      $("form-message").textContent = message;
      $("form-message").className = "message " + type;
      $("form-message").classList.remove("hidden");
    }

    async function api(action, data = {}) {
      const response = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action, ...data })
      });

      let result;
      try {
        result = await response.json();
      } catch {
        throw new Error("A szerver nem érvényes választ küldött.");
      }

      if (!response.ok) {
        throw new Error(result.error || "Szerverhiba: " + response.status);
      }

      return result.data;
    }

    function dateDifference(dateString) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const expiry = new Date(dateString + "T00:00:00");
      return Math.round((expiry - today) / 86400000);
    }

    function expiryClass(days) {
      if (days < 0) return "expired";
      if (days <= 10) return "soon";
      if (days <= 30) return "medium";
      return "normal";
    }

    function expiryText(days) {
      if (days < 0) return "Lejárt " + Math.abs(days) + " napja";
      if (days === 0) return "Ma jár le";
      if (days === 1) return "Holnap jár le";
      return days + " nap van hátra";
    }

    function formatDate(dateString) {
      const parts = dateString.split("-");
      return parts[2] + "." + parts[1] + "." + parts[0] + ".";
    }

    function renderProducts() {
      const query = $("search").value.trim().toLocaleLowerCase("hu");
      const category = $("category-filter").value;
      const sort = $("sort-filter").value;

      let filtered = products.filter(product => {
        const name = String(product.name).toLocaleLowerCase("hu");
        const number = String(product.product_number ?? "");
        const matchesSearch =
          name.includes(query) || number.includes(query);
        const matchesCategory =
          !category || product.category === category;

        return matchesSearch && matchesCategory;
      });

      filtered.sort((a, b) => {
        if (sort === "number") {
          return Number(a.product_number) - Number(b.product_number);
        }
        if (sort === "name") {
          return a.name.localeCompare(b.name, "hu");
        }
        return a.expiry_date.localeCompare(b.expiry_date);
      });

      $("products").replaceChildren();

      if (filtered.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = products.length
          ? "Nincs ilyen termék a készletben."
          : "A készlet üres. A + gombbal adhatsz hozzá terméket.";
        $("products").appendChild(empty);
        return;
      }

      for (const product of filtered) {
        const days = dateDifference(product.expiry_date);
        const card = document.createElement("article");
        card.className = "product";
        card.tabIndex = 0;
        card.setAttribute("role", "button");
        card.setAttribute("aria-label", product.name + " szerkesztése");

        const top = document.createElement("div");
        top.className = "product-top";

        const name = document.createElement("div");
        name.className = "product-name";
        name.textContent = product.name;

        const number = document.createElement("div");
        number.className = "number";
        number.textContent = String(product.product_number);

        top.append(name, number);

        const details = document.createElement("div");
        details.className = "details";
        details.textContent =
          product.category + " · Lejárat: " + formatDate(product.expiry_date);

        const expiry = document.createElement("div");
        expiry.className = "expiry " + expiryClass(days);
        expiry.textContent = expiryText(days);

        card.append(top, details, expiry);

        card.addEventListener("click", () => openEditor(product));
        card.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openEditor(product);
          }
        });

        $("products").appendChild(card);
      }
    }

    async function refresh() {
      if (loading) return;
      loading = true;
      $("add-button").disabled = true;
      showStatus("Készlet betöltése…");

      try {
        products = await api("list");
        if (!Array.isArray(products)) {
          throw new Error("A szerver nem megfelelő adatokat küldött.");
        }
        renderProducts();
        showStatus("Termékek száma: " + products.length, "success");
      } finally {
        loading = false;
        $("add-button").disabled = false;
      }
    }

    function availableNumber() {
      const used = new Set(
        products
          .filter(p => p.id !== editingId)
          .map(p => Number(p.product_number))
      );

      let number = 1;
      while (used.has(number)) number++;
      return number;
    }

    function openEditor(product = null) {
      editingId = product ? Number(product.id) : null;
      $("product-form").reset();
      $("form-message").classList.add("hidden");

      $("editor-title").textContent =
        product ? "Termék szerkesztése" : "Új termék";

      $("product-number").value = product
        ? product.product_number
        : availableNumber();

      $("product-name").value = product ? product.name : "";
      $("expiry-date").value = product ? product.expiry_date : "";
      $("product-category").value = product
        ? product.category
        : "Egyéb";

      $("delete-button").classList.toggle("hidden", !product);
      $("editor").classList.add("open");
      $("product-name").focus();
    }

    function closeEditor() {
      $("editor").classList.remove("open");
      editingId = null;
    }

    async function handleSave(event) {
      event.preventDefault();

      const productNumber = Number($("product-number").value);
      const name = $("product-name").value.trim();
      const expiryDate = $("expiry-date").value;
      const category = $("product-category").value;

      if (!Number.isSafeInteger(productNumber) || productNumber < 1) {
        showFormMessage("Adj meg érvényes, pozitív sorszámot.");
        return;
      }

      if (!name || !expiryDate || !CATEGORIES.includes(category)) {
        showFormMessage("Töltsd ki helyesen az összes mezőt.");
        return;
      }

      const duplicate = products.some(product =>
        Number(product.product_number) === productNumber &&
        Number(product.id) !== editingId
      );

      if (duplicate) {
        showFormMessage("Ez a sorszám már használatban van.");
        return;
      }

      const payload = {
        product_number: productNumber,
        name,
        expiry_date: expiryDate,
        category
      };

      $("save-button").disabled = true;

      try {
        if (editingId === null) {
          await api("add", payload);
        } else {
          await api("update", { id: editingId, ...payload });
        }

        closeEditor();
        await refresh();
      } catch (error) {
        showFormMessage("Mentési hiba: " + error.message);
      } finally {
        $("save-button").disabled = false;
      }
    }

    async function handleDelete() {
      if (editingId === null) return;

      if (!confirm("Biztosan törlöd ezt a terméket? A sorszáma felszabadul.")) {
        return;
      }

      $("delete-button").disabled = true;

      try {
        await api("delete", { id: editingId });
        closeEditor();
        await refresh();
      } catch (error) {
        showFormMessage("Törlési hiba: " + error.message);
      } finally {
        $("delete-button").disabled = false;
      }
    }

    $("product-form").addEventListener("submit", handleSave);
    $("search").addEventListener("input", renderProducts);
    $("category-filter").addEventListener("change", renderProducts);
    $("sort-filter").addEventListener("change", renderProducts);
    $("add-button").addEventListener("click", () => openEditor());
    $("cancel-editor").addEventListener("click", closeEditor);
    $("delete-button").addEventListener("click", handleDelete);

    $("editor").addEventListener("click", event => {
      if (event.target === $("editor")) closeEditor();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeEditor();
    });

    refresh().catch(error => {
      showStatus(
        "Nem sikerült betölteni a készletet: " + error.message,
        "error"
      );
    });
  </script>
</body>
  </html>
