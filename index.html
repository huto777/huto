<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>Hűtő</title>
<style>
:root {
  color-scheme: dark;
  --bg: #101827;
  --panel: #1b2638;
  --border: #334155;
  --blue: #2997ff;
  --text: #f1f5f9;
  --muted: #9caec3;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px 16px 100px;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}
main { max-width: 700px; margin: auto; }
h1 { margin: 8px 0 20px; font-size: 32px; }
input, select, button {
  font: inherit;
}
input, select {
  width: 100%;
  padding: 13px;
  margin: 5px 0 14px;
  color: var(--text);
  background: #111c2d;
  border: 1px solid var(--border);
  border-radius: 10px;
}
#search { margin-bottom: 16px; }
.product {
  padding: 15px;
  margin-bottom: 10px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-left: 5px solid #94a3b8;
  border-radius: 12px;
  cursor: pointer;
}
.product.expired { border-left-color: #ff4545; }
.product.soon { border-left-color: #2997ff; }
.product.medium { border-left-color: #35d07f; }
.product-top {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: start;
}
.product-name { font-size: 17px; font-weight: bold; overflow-wrap: anywhere; }
.product-number { color: var(--muted); font-size: 12px; }
.product-meta { color: var(--muted); font-size: 14px; margin-top: 8px; }
.empty { color: var(--muted); text-align: center; padding: 35px 10px; }
#add {
  position: fixed;
  right: 22px;
  bottom: 22px;
  width: 60px;
  height: 60px;
  border: 0;
  border-radius: 50%;
  background: var(--blue);
  color: white;
  font-size: 36px;
  box-shadow: 0 5px 24px #0007;
  cursor: pointer;
  z-index: 5;
}
#overlay {
  position: fixed;
  inset: 0;
  background: #0009;
  z-index: 10;
  display: none;
  align-items: end;
}
#overlay.open { display: flex; }
.sheet {
  width: 100%;
  max-height: 90dvh;
  overflow-y: auto;
  padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
  background: #182437;
  border-radius: 22px 22px 0 0;
  border-top: 1px solid var(--border);
}
.sheet-inner { max-width: 660px; margin: auto; }
.sheet h2 { margin: 0 0 22px; }
label { display: block; font-size: 14px; color: #c5d2e2; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions button, .primary, .secondary, .danger {
  border: 0;
  border-radius: 10px;
  padding: 13px 16px;
  cursor: pointer;
}
.primary { background: var(--blue); color: white; flex: 1; }
.secondary { background: #344257; color: white; }
.danger { background: #8e2937; color: white; }
#message { color: #a9c8ed; font-size: 14px; margin: 12px 0; }
#login {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
}
#login.hidden { display: none; }
.login-card {
  width: 100%;
  max-width: 380px;
  padding: 24px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 18px;
}
.login-card h1 { margin-top: 0; }
button:disabled { opacity: .6; cursor: wait; }
</style>
</head>
<body>
<main>
  <h1>Hűtő</h1>
  <input id="search" type="search"
    placeholder="Keresés név vagy sorszám alapján..."
    aria-label="Termék keresése">
  <div id="message" role="status"></div>
  <div id="list"><div class="empty">Betöltés...</div></div>
</main>

<button id="add" aria-label="Új termék hozzáadása">+</button>

<div id="overlay">
  <section class="sheet">
    <div class="sheet-inner">
      <h2 id="formTitle">Új termék</h2>
      <form id="productForm">
        <label for="name">Termék neve</label>
        <input id="name" maxlength="120" required>

        <label for="date">Lejárati dátum</label>
        <input id="date" type="date" required>

        <label for="category">Kategória</label>
        <select id="category">
          <option>Tejtermék</option>
          <option>Hús</option>
          <option>Zöldség</option>
          <option>Gyümölcs</option>
          <option>Ital</option>
          <option>Felvágott</option>
          <option>Szósz</option>
          <option>Maradék</option>
          <option>Egyéb</option>
        </select>

        <div class="actions">
          <button class="primary" id="save" type="submit">Mentés</button>
          <button class="secondary" id="cancel" type="button">Mégse</button>
          <button class="danger" id="delete" type="button"
            hidden>Törlés</button>
        </div>
      </form>
    </div>
  </section>
</div>

<div id="login">
  <form id="loginForm" class="login-card">
    <h1>Hűtő</h1>
    <p>Add meg a családi PIN-kódot.</p>
    <label for="pin">PIN-kód</label>
    <input id="pin" type="password" inputmode="numeric"
      autocomplete="current-password" required>
    <label style="display:flex;gap:9px;align-items:center;margin-bottom:16px">
      <input id="remember" type="checkbox" checked
        style="width:auto;margin:0">
      Belépés megjegyzése ezen a telefonon
    </label>
    <button class="primary" id="loginButton" type="submit"
      style="width:100%">Belépés</button>
    <div id="loginError" role="status"></div>
  </form>
</div>

<script>
const API_URL =
  "https://tvotoadiuakjjxsqrexi.supabase.co/functions/v1/smooth-processor";

const PUBLISHABLE_KEY =
  "sb_publishable_rmGfVCE9AJvZ1u_YFnjHzA_yT05nA7P";

const $ = id => document.getElementById(id);

let pin = sessionStorage.getItem("fridge_pin") || "";
let products = [];
let editingId = null;
let busy = false;

function message(text) {
  $("message").textContent = text;
}

async function api(action, extra = {}) {
  const response = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": PUBLISHABLE_KEY
    },
    body: JSON.stringify({ pin, action, ...extra })
  });

  let result;
  try {
    result = await response.json();
  } catch {
    throw new Error("A szerver nem adott értelmezhető választ.");
  }

  if (!response.ok) {
    if (response.status === 401) {
      throw new Error("Hibás PIN-kód. Ellenőrizd a beállítást.");
    }
    throw new Error(result.error || "Szerverhiba: " + response.status);
  }
  return result.data;
}

function daysUntil(date) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const expiry = new Date(date + "T00:00:00");
  return Math.round((expiry - today) / 86400000);
}

function render() {
  const query = $("search").value.trim().toLocaleLowerCase("hu");

  const sorted = [...products].sort((a, b) =>
    a.expiry_date.localeCompare(b.expiry_date)
  );

  const visible = sorted.filter((p, i) =>
    p.name.toLocaleLowerCase("hu").includes(query) ||
    String(i + 1).includes(query)
  );

  $("list").replaceChildren();

  if (!visible.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = products.length
      ? "Nincs találat."
      : "Még nincs termék a hűtőben. Koppints a + gombra!";
    $("list").append(empty);
    return;
  }

  visible.forEach(p => {
    const index = sorted.findIndex(item => item.id === p.id) + 1;
    const days = daysUntil(p.expiry_date);

    const card = document.createElement("article");
    card.className = "product " +
      (days < 0 ? "expired" :
       days <= 10 ? "soon" :
       days <= 30 ? "medium" : "");

    const top = document.createElement("div");
    top.className = "product-top";

    const name = document.createElement("div");
    name.className = "product-name";
    name.textContent = p.name;

    const number = document.createElement("div");
    number.className = "product-number";
    number.textContent = "#" + index;

    top.append(name, number);

    const meta = document.createElement("div");
    meta.className = "product-meta";
    meta.textContent = p.expiry_date + " · " + p.category;

    card.append(top, meta);
    card.addEventListener("click", () => openEditor(p));
    $("list").append(card);
  });
}

async function refresh() {
  if (!pin) return;
  message("Adatok betöltése...");
  try {
    products = await api("list") || [];
    render();
    message("");
  } catch (error) {
    message(error.message);
  }
}

function openEditor(product = null) {
  editingId = product ? product.id : null;
  $("formTitle").textContent = product ? "Termék szerkesztése" : "Új termék";
  $("name").value = product?.name || "";
  $("date").value = product?.expiry_date || "";
  $("category").value = product?.category || "Egyéb";
  $("delete").hidden = !product;
  $("overlay").classList.add("open");
  if (!product) $("date").value = "";
  $("name").focus();
}

function closeEditor() {
  $("overlay").classList.remove("open");
  $("productForm").reset();
  editingId = null;
}

async function runBusy(button, task) {
  if (busy) return;
  busy = true;
  button.disabled = true;
  try {
    await task();
  } catch (error) {
    alert(error.message);
  } finally {
    busy = false;
    button.disabled = false;
  }
}

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  const enteredPin = $("pin").value.trim();
  if (!enteredPin) return;

  $("loginButton").disabled = true;
  $("loginError").textContent = "Ellenőrzés...";

  pin = enteredPin;
  try {
    await api("list");
    if ($("remember").checked) {
      sessionStorage.removeItem("fridge_pin");
      localStorage.setItem("fridge_pin", pin);
    } else {
      localStorage.removeItem("fridge_pin");
      sessionStorage.setItem("fridge_pin", pin);
    }

    products = await api("list") || [];
    $("login").classList.add("hidden");
    $("pin").value = "";
    render();
    message("");
  } catch (error) {
    pin = "";
    $("loginError").textContent = error.message;
  } finally {
    $("loginButton").disabled = false;
  }
});

$("add").addEventListener("click", () => openEditor());
$("cancel").addEventListener("click", closeEditor);
$("search").addEventListener("input", render);

$("productForm").addEventListener("submit", async event => {
  event.preventDefault();

  const button = $("save");
  await runBusy(button, async () => {
    const data = {
      name: $("name").value.trim(),
      expiry_date: $("date").value,
      category: $("category").value
    };

    if (!data.name || !data.expiry_date) {
      throw new Error("Add meg a termék nevét és lejárati dátumát.");
    }

    if (editingId !== null) {
      await api("update", { id: editingId, ...data });
    } else {
      await api("add", data);
    }

    closeEditor();
    await refresh();
  });
});

$("delete").addEventListener("click", async () => {
  if (editingId === null) return;
  if (!confirm("Biztosan törlöd ezt a terméket?")) return;

  await runBusy($("delete"), async () => {
    await api("delete", { id: editingId });
    closeEditor();
    await refresh();
  });
});

pin = localStorage.getItem("fridge_pin") ||
      sessionStorage.getItem("fridge_pin") || "";

if (pin) {
  $("login").classList.add("hidden");
  refresh().catch(error => message(error.message));
} else {
  $("login").classList.remove("hidden");
}
</script>
</body>
                                    </html>
