<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6fa">
  <title>Hűtő</title>
  <style>
    :root {
      --bg: #f5f6fa;
      --card: #ffffff;
      --text: #202331;
      --muted: #777d8c;
      --border: #e5e7ee;
      --blue: #3478f6;
      --red-bg: #ffe4e4;
      --red: #b42318;
      --green-bg: #dff7e6;
      --green: #16723a;
      --soon-bg: #dceaff;
      --soon: #2058bd;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    button, input, select {
      font: inherit;
    }

    button { cursor: pointer; }

    .page {
      width: min(100% - 28px, 620px);
      margin: 0 auto;
      padding: 24px 0 100px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: -1px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-top: 5px;
    }

    .count {
      background: white;
      border: 1px solid var(--border);
      padding: 9px 12px;
      border-radius: 14px;
      font-size: 13px;
    }

    .search-wrap { margin-bottom: 14px; }

    .search {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: white;
      outline: none;
    }

    .search:focus, input:focus, select:focus {
      border-color: var(--blue);
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 0 14px;
    }

    .filter {
      white-space: nowrap;
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
      border-radius: 20px;
      padding: 9px 13px;
      font-size: 13px;
    }

    .filter.active {
      background: var(--text);
      color: white;
      border-color: var(--text);
    }

    .products {
      display: grid;
      gap: 10px;
    }

    .product {
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 5px solid #cbd0da;
      border-radius: 16px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      color: inherit;
    }

    .product.expired {
      background: var(--red-bg);
      border-left-color: var(--red);
    }

    .product.soon {
      background: var(--soon-bg);
      border-left-color: var(--soon);
    }

    .product.medium {
      background: var(--green-bg);
      border-left-color: var(--green);
    }

    .number {
      width: 39px;
      height: 39px;
      flex-shrink: 0;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.8);
      font-size: 17px;
      font-weight: 700;
    }

    .product-info {
      flex: 1;
      min-width: 0;
    }

    .product-name {
      font-size: 16px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .product-meta {
      color: #555c6b;
      font-size: 12px;
      margin-top: 5px;
      line-height: 1.5;
    }

    .days {
      flex-shrink: 0;
      text-align: right;
      font-size: 12px;
      font-weight: 700;
    }

    .empty {
      text-align: center;
      padding: 42px 15px;
      color: var(--muted);
      background: white;
      border-radius: 18px;
      border: 1px solid var(--border);
    }

    .add-button {
      position: fixed;
      right: max(22px, calc((100vw - 620px) / 2));
      bottom: 22px;
      width: 60px;
      height: 60px;
      border: 0;
      border-radius: 21px;
      color: white;
      background: var(--blue);
      font-size: 34px;
      box-shadow: 0 7px 22px #3478f655;
      z-index: 5;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: #11182777;
      z-index: 10;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .hidden { display: none !important; }

    .sheet {
      width: min(100%, 620px);
      max-height: 90dvh;
      overflow-y: auto;
      background: white;
      border-radius: 24px 24px 0 0;
      padding: 22px 20px max(24px, env(safe-area-inset-bottom));
      animation: rise .18s ease-out;
    }

    @keyframes rise {
      from { transform: translateY(30px); opacity: .5; }
      to { transform: translateY(0); opacity: 1; }
    }

    .sheet-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .sheet h2 {
      font-size: 21px;
      margin: 0;
    }

    .close {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 12px;
      background: var(--bg);
      font-size: 22px;
    }

    .field { margin-bottom: 16px; }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .field input, .field select {
      display: block;
      width: 100%;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
      outline: none;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.5;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    .primary, .secondary, .danger {
      padding: 13px;
      border-radius: 12px;
      border: 0;
      font-weight: 700;
    }

    .primary { background: var(--blue); color: white; }
    .secondary { background: #eef0f5; color: var(--text); }
    .danger { background: #ffe5e5; color: var(--red); }

    .full { width: 100%; }

    .login-card {
      margin: 60px auto 0;
      max-width: 420px;
      padding: 25px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 22px;
    }

    .login-card h2 { margin-top: 0; }

    .remember {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 13px 0;
      font-size: 13px;
    }

    .remember input { width: auto; }

    .message {
      margin: 12px 0;
      font-size: 13px;
      color: var(--red);
      line-height: 1.5;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 11px;
      color: var(--muted);
      margin: 0 0 15px;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 4px;
    }

    .login-title {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <main class="page">
    <section id="login" class="login-card">
      <div class="login-title">Hűtő</div>
      <p>Írd be a családi PIN-kódot a közös készlet megnyitásához.</p>
      <form id="login-form">
        <div class="field">
          <label for="pin">PIN-kód</label>
          <input id="pin" type="password" inputmode="numeric"
                 autocomplete="current-password" required>
        </div>
        <label class="remember">
          <input id="remember" type="checkbox" checked>
          Belépés megjegyzése ezen a telefonon
        </label>
        <button class="primary full" type="submit">Belépés</button>
        <div id="login-message" class="message"></div>
      </form>
    </section>

    <section id="app" class="hidden">
      <header>
        <div>
          <h1>Hűtő</h1>
          <div class="subtitle">Közös élelmiszerkészlet</div>
        </div>
        <div class="count"><span id="count">0</span> termék</div>
      </header>

      <div class="search-wrap">
        <input id="search" class="search"
               placeholder="Keresés név vagy sorszám alapján…"
               autocomplete="off">
      </div>

      <div id="filters" class="filters"></div>

      <div class="legend">
        <span><i class="dot" style="background:#b42318"></i>Lejárt</span>
        <span><i class="dot" style="background:#2058bd"></i>10 napon belül</span>
        <span><i class="dot" style="background:#16723a"></i>11–30 nap</span>
        <span><i class="dot" style="background:#cbd0da"></i>30 nap felett</span>
      </div>

      <div id="products" class="products"></div>
      <div id="app-message" class="message"></div>
    </section>
  </main>

  <button id="add-button" class="add-button hidden"
          aria-label="Termék hozzáadása">+</button>

  <div id="editor" class="overlay hidden">
    <section class="sheet">
      <div class="sheet-top">
        <h2 id="editor-title">Új termék</h2>
        <button id="close-editor" class="close" aria-label="Bezárás">×</button>
      </div>

      <form id="product-form">
        <div class="field">
          <label for="product-number">Sorszám</label>
          <select id="product-number" required></select>
          <div class="hint">
            A sorszám a termékhez tartozik, és nem változik meg.
            Törlés után újra kiválasztható.
          </div>
        </div>

        <div class="field">
          <label for="product-name">Termék neve</label>
          <input id="product-name" maxlength="120"
                 placeholder="Pl. tej" required>
        </div>

        <div class="field">
          <label for="expiry-date">Lejárati dátum</label>
          <input id="expiry-date" type="date" required>
        </div>

        <div class="field">
          <label for="category">Kategória</label>
          <select id="category" required>
            <option value="Tejtermék">Tejtermék</option>
            <option value="Hús, hal">Hús, hal</option>
            <option value="Zöldség, gyümölcs">Zöldség, gyümölcs</option>
            <option value="Pékáru">Pékáru</option>
            <option value="Ital">Ital</option>
            <option value="Konzerv">Konzerv</option>
            <option value="Fagyasztott">Fagyasztott</option>
            <option value="Egyéb">Egyéb</option>
          </select>
        </div>

        <div id="form-message" class="message"></div>

        <div class="actions">
          <button type="button" id="cancel-editor" class="secondary">Mégse</button>
          <button type="submit" class="primary">Mentés</button>
        </div>
        <button type="button" id="delete-button"
                class="danger full hidden" style="margin-top:10px">
          Termék törlése
        </button>
      </form>
    </section>
  </div>

  <script>
    const API_URL =
      "https://tvotoadiuakjjxsqrexi.supabase.co/functions/v1/smooth-processor";

    const PUBLISHABLE_KEY =
      "sb_publishable_rmGfVCE9AJvZ1u_YFnjHzA_yT05nA7P";

    const CATEGORIES = [
      "Tejtermék",
      "Hús, hal",
      "Zöldség, gyümölcs",
      "Pékáru",
      "Ital",
      "Konzerv",
      "Fagyasztott",
      "Egyéb"
    ];

    const $ = id => document.getElementById(id);

    let pin = "";
    let products = [];
    let editingId = null;
    let activeCategory = "Mind";

    function showMessage(id, text) {
      $(id).textContent = text || "";
    }

    async function api(action, extra = {}) {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": PUBLISHABLE_KEY
        },
        body: JSON.stringify({ pin, action, ...extra })
      });

      let result;
      try {
        result = await response.json();
      } catch {
        throw new Error("A szerver nem értelmezhető választ küldött.");
      }

      if (!response.ok) {
        throw new Error(result.error || "A művelet nem sikerült.");
      }

      return result.data;
    }

    function dayDifference(dateString) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const expiry = new Date(dateString + "T00:00:00");
      return Math.round((expiry - today) / 86400000);
    }

    function dateText(dateString) {
      const [year, month, day] = dateString.split("-");
      return `${year}. ${month}. ${day}.`;
    }

    function statusFor(product) {
      const days = dayDifference(product.expiry_date);
      if (days < 0) return "expired";
      if (days <= 10) return "soon";
      if (days <= 30) return "medium";
      return "";
    }

    function statusText(product) {
      const days = dayDifference(product.expiry_date);
      if (days < 0) return `${Math.abs(days)} napja lejárt`;
      if (days === 0) return "Ma jár le";
      if (days === 1) return "Holnap jár le";
      return `${days} nap van hátra`;
    }

    function renderFilters() {
      const categories = [
        "Mind",
        ...CATEGORIES.filter(category =>
          products.some(p => p.category === category)
        )
      ];

      if (!categories.includes(activeCategory)) {
        activeCategory = "Mind";
      }

      $("filters").replaceChildren();

      categories.forEach(category => {
        const button = document.createElement("button");
        button.className = "filter" +
          (activeCategory === category ? " active" : "");
        button.textContent = category;
        button.type = "button";
        button.addEventListener("click", () => {
          activeCategory = category;
          renderFilters();
          renderProducts();
        });
        $("filters").appendChild(button);
      });
    }

    function renderProducts() {
      const search = $("search").value.trim().toLocaleLowerCase("hu");
      const container = $("products");
      container.replaceChildren();

      const filtered = products
        .filter(product => {
          const matchesCategory = activeCategory === "Mind" ||
            product.category === activeCategory;
          const matchesSearch =
            String(product.product_number).includes(search) ||
            product.name.toLocaleLowerCase("hu").includes(search);
          return matchesCategory && matchesSearch;
        })
        .sort((a, b) => {
          const dateOrder = a.expiry_date.localeCompare(b.expiry_date);
          return dateOrder || a.product_number - b.product_number;
        });

      $("count").textContent = products.length;

      if (!filtered.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = products.length
          ? "Nincs ilyen termék a listában."
          : "Még nincs termék a hűtőben. Nyomd meg a + gombot!";
        container.appendChild(empty);
        return;
      }

      filtered.forEach(product => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "product " + statusFor(product);

        const number = document.createElement("div");
        number.className = "number";
        number.textContent = product.product_number;

        const info = document.createElement("div");
        info.className = "product-info";

        const name = document.createElement("div");
        name.className = "product-name";
        name.textContent = product.name;

        const meta = document.createElement("div");
        meta.className = "product-meta";
        meta.textContent =
          `${product.category} · Lejár: ${dateText(product.expiry_date)}`;

        const days = document.createElement("div");
        days.className = "days";
        days.textContent = statusText(product);

        info.append(name, meta);
        button.append(number, info, days);
        button.addEventListener("click", () => openEditor(product));
        container.appendChild(button);
      });
    }

    async function refresh() {
      products = await api("list") || [];
      renderFilters();
      renderProducts();
    }

    function availableNumbers(currentNumber = null) {
      const used = new Set(
        products
          .filter(product => product.id !== editingId)
          .map(product => Number(product.product_number))
      );

      const select = $("product-number");
      select.replaceChildren();

      if (currentNumber !== null) used.delete(Number(currentNumber));

      const maxNumber = Math.max(50, ...used, currentNumber || 0);
      for (let number = 1; number <= maxNumber + 1; number++) {
        if (!used.has(number) || number === Number(currentNumber)) {
          const option = document.createElement("option");
          option.value = number;
          option.textContent = String(number);
          select.appendChild(option);
        }
      }

      if (currentNumber !== null) {
        select.value = String(currentNumber);
      } else {
        const firstFree = [...select.options].find(option =>
          !used.has(Number(option.value))
        );
        if (firstFree) select.value = firstFree.value;
      }
    }

    function openEditor(product = null) {
      editingId = product ? product.id : null;
      $("editor-title").textContent =
        product ? "Termék szerkesztése" : "Új termék";
      $("product-name").value = product ? product.name : "";
      $("expiry-date").value = product ? product.expiry_date : "";
      $("category").value = product
        ? product.category
        : "Tejtermék";

      availableNumbers(product ? product.product_number : null);
      $("delete-button").classList.toggle("hidden", !product);
      showMessage("form-message", "");
      $("editor").classList.remove("hidden");
    }

    function closeEditor() {
      $("editor").classList.add("hidden");
      editingId = null;
    }

    async function handleLogin(event) {
      event.preventDefault();
      pin = $("pin").value.trim();
      showMessage("login-message", "");

      try {
        await refresh();

        const storage = $("remember").checked
          ? localStorage
          : sessionStorage;
        const otherStorage = $("remember").checked
          ? sessionStorage
          : localStorage;

        otherStorage.removeItem("fridge_pin");
        storage.setItem("fridge_pin", pin);

        $("login").classList.add("hidden");
        $("app").classList.remove("hidden");
        $("add-button").classList.remove("hidden");
      } catch (error) {
        pin = "";
        showMessage(
          "login-message",
          error.message === "Incorrect PIN"
            ? "Hibás PIN-kód."
            : "Nem sikerült belépni: " + error.message
        );
      }
    }

    async function handleSave(event) {
      event.preventDefault();
      showMessage("form-message", "");

      const productNumber = Number($("product-number").value);
      const name = $("product-name").value.trim();
      const expiryDate = $("expiry-date").value;
      const category = $("category").value;

      if (!Number.isInteger(productNumber) || productNumber < 1) {
        showMessage("form-message", "Válassz érvényes sorszámot.");
        return;
      }

      const duplicate = products.some(product =>
        Number(product.product_number) === productNumber &&
        product.id !== editingId
      );

      if (duplicate) {
        showMessage("form-message", "Ez a sorszám már foglalt.");
        return;
      }

      try {
        const details = {
          product_number: productNumber,
          name,
          expiry_date: expiryDate,
          category
        };

        if (editingId !== null) {
          await api("update", { id: editingId, ...details });
        } else {
          await api("add", details);
        }

        await refresh();
        closeEditor();
      } catch (error) {
        showMessage("form-message", "Mentési hiba: " + error.message);
      }
    }

    async function handleDelete() {
      if (editingId === null) return;
      if (!confirm("Biztosan törlöd ezt a terméket? A sorszáma felszabadul.")) {
        return;
      }

      try {
        await api("delete", { id: editingId });
        await refresh();
        closeEditor();
      } catch (error) {
        showMes
            $("editor").addEventListener("click", event => {
      if (event.target === $("editor")) closeEditor();
    });

    async function start() {
      pin = localStorage.getItem("fridge_pin") ||
            sessionStorage.getItem("fridge_pin") || "";

      if (!pin) return;

      try {
        await refresh();
        $("login").classList.add("hidden");
        $("app").classList.remove("hidden");
        $("add-button").classList.remove("hidden");
      } catch {
        localStorage.removeItem("fridge_pin");
        sessionStorage.removeItem("fridge_pin");
        pin = "";
        $("login").classList.remove("hidden");
      }
    }

    start();
  </script>
</body>
</html>
