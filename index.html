
<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Hűtőkészlet</title>
<style>
:root{color-scheme:dark;--bg:#10141c;--panel:#191f2b;--border:#303b4d;--text:#f1f5f9;--muted:#9ba8ba;--accent:#3988ef}
*{box-sizing:border-box}
body{margin:0;padding:24px 14px 100px;background:var(--bg);color:var(--text);font-family:system-ui,Arial,sans-serif}
main{max-width:850px;margin:auto}
header{margin-bottom:24px}
h1{font-size:clamp(28px,6vw,38px);margin:0 0 6px}
h2{font-size:19px;margin:0 0 15px}
.subtitle,.muted{color:var(--muted)}
.subtitle{margin:0;font-size:14px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:18px}
input,select,button{font:inherit;border-radius:10px}
input,select{width:100%;padding:12px;background:#101722;border:1px solid var(--border);color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--accent)}
label{display:block;margin-bottom:6px;font-size:13px;color:var(--muted)}
button{border:0;padding:12px 16px;cursor:pointer;font-weight:650}
.primary{background:var(--accent);color:white;width:100%}
.secondary{background:#222a38;color:var(--text);border:1px solid var(--border)}
.danger{background:#3a2028;color:#ffb7c2;border:1px solid #63303d}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.toolbar h2{margin:0}
.count{color:var(--muted);font-size:13px}
.search-wrap{margin-bottom:14px}
.product-list{display:grid;gap:10px}
.product{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:12px;border:1px solid var(--border);border-left:5px solid #8993a3;background:#202735;transition:transform .35s ease,box-shadow .35s ease,border-color .35s ease}
.product.expired{border-left-color:#ff4f61;background:#321e28}
.product.soon-blue{border-left-color:#429bff;background:#192c43}
.product.soon-green{border-left-color:#38c985;background:#19362e}
.product.just-saved{transform:scale(1.035);box-shadow:0 0 0 2px var(--accent),0 0 24px #3988ef80;z-index:1}
.number{display:flex;align-items:center;justify-content:center;flex:0 0 40px;height:40px;border-radius:10px;background:#0003;font-size:17px;font-weight:750}
.product-info{flex:1;min-width:0}
.product-name{font-weight:700;overflow-wrap:anywhere}
.product-meta{display:flex;flex-wrap:wrap;gap:5px 10px;margin-top:5px;font-size:13px;color:#d0d8e4}
.product-status{font-size:12px;font-weight:650;margin-top:6px}
.expired .product-status{color:#ff8795}
.soon-blue .product-status{color:#80bdff}
.soon-green .product-status{color:#76e6b1}
.normal .product-status{color:#bdc7d6}
.product-actions{display:flex;flex-direction:column;gap:6px}
.product-actions button{font-size:12px;padding:8px}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.message{display:none;margin-bottom:14px;padding:12px;border-radius:10px;font-size:14px;overflow-wrap:anywhere}
.message.show{display:block}
.message.error{background:#3a2028;color:#ffc0c8}
.message.success{background:#19362e;color:#9cf0c6}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.legend span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}
.fab{position:fixed;right:22px;bottom:22px;width:62px;height:62px;border-radius:50%;background:#3988ef;color:white;font-size:36px;font-weight:400;box-shadow:0 6px 25px #0008;display:flex;align-items:center;justify-content:center;z-index:5;padding:0}
.fab:active{transform:scale(.96)}
.modal-backdrop{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal-backdrop.open{display:flex}
.modal{width:100%;max-width:460px;max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:20px}
.modal-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.modal-header h2{margin:0}
.close{background:transparent;color:var(--muted);font-size:26px;padding:0 6px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{min-width:0}
.full{grid-column:1/-1}
@media(max-width:540px){
 body{padding:18px 10px 100px}
 .panel{padding:14px}
 .product{gap:8px;padding:10px}
 .number{flex-basis:34px;height:34px}
 .product-actions button{padding:7px}
 .form-grid{grid-template-columns:1fr}
 .full{grid-column:auto}
 .fab{width:58px;height:58px;right:18px;bottom:18px}
}
@media(prefers-reduced-motion:reduce){
 .product{transition:none}
}
</style>
</head>
<body>
<main>
<header>
<h1>Hűtőkészlet</h1>
<p class="subtitle">A legkorábban lejáró termék mindig legfelül.</p>
</header>

<div id="message" class="message" role="status"></div>

<section class="panel">
<div class="toolbar">
<h2>Termékek</h2>
<span id="count" class="count">Betöltés…</span>
</div>
<div class="search-wrap">
<label for="search">Keresés név, kategória vagy sorszám szerint</label>
<input id="search" type="search" placeholder="Pl. tej, hús, 12…" autocomplete="off">
</div>
<div id="productList" class="product-list">
<div class="empty">Termékek betöltése…</div>
</div>
<div class="legend">
<span><i class="dot" style="background:#ff4f61"></i>Lejárt</span>
<span><i class="dot" style="background:#429bff"></i>10 napon belül</span>
<span><i class="dot" style="background:#38c985"></i>11–30 nap</span>
<span><i class="dot" style="background:#8993a3"></i>30 napnál több</span>
</div>
</section>
<p class="footer">A sorrend automatikusan a lejárati dátum alapján változik.</p>
</main>

<button id="addButton" class="fab" type="button" aria-label="Új termék hozzáadása" title="Új termék">+</button>

<div id="modalBackdrop" class="modal-backdrop">
<section class="modal" role="dialog" aria-modal="true" aria-labelledby="formTitle">
<div class="modal-header">
<h2 id="formTitle">Új termék</h2>
<button id="closeModal" class="close" type="button" aria-label="Bezárás">×</button>
</div>
<form id="productForm">
<div class="form-grid">
<div class="field full">
<label for="name">Termék neve</label>
<input id="name" maxlength="120" placeholder="Pl. tej, alma, csirkemell" required>
</div>
<div class="field full">
<label for="category">Kategória</label>
<select id="category" required>
<option value="Zöldség, gyümölcs">Zöldség, gyümölcs</option>
<option value="Hús">Hús</option>
<option value="Tejtermék">Tejtermék</option>
<option value="Ital">Ital</option>
<option value="Egyéb">Egyéb</option>
</select>
</div>
<div class="field full">
<label for="expiry">Lejárati dátum</label>
<input id="expiry" type="date" required>
</div>
<div class="field full">
<button id="saveButton" class="primary" type="submit">Termék hozzáadása</button>
<button id="cancelEdit" class="secondary" type="button" style="display:none;width:100%;margin-top:8px">Mégse</button>
</div>
</div>
</form>
</section>
</div>

<script>
const API_URL="https://tvotoadiuakjjxsqrexi.supabase.co/functions/v1/smooth-processor";

// Ez a publikus kulcs való a böngészőből indított kérésekhez.
// A titkos (secret/service_role) kulcsot soha ne tedd ide.
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_rmGfVCE9AJvZ1u_YFnjHzA_yT05nA7P";

const categories=["Zöldség, gyümölcs","Hús","Tejtermék","Ital","Egyéb"];
const $=id=>document.getElementById(id);
const form=$("productForm"),nameInput=$("name"),categoryInput=$("category"),expiryInput=$("expiry");
const searchInput=$("search"),productList=$("productList"),countElement=$("count");
const messageElement=$("message"),saveButton=$("saveButton"),cancelEdit=$("cancelEdit");
const backdrop=$("modalBackdrop"),formTitle=$("formTitle");
let products=[],editingId=null,busy=false;

function showMessage(text,type="error"){
 messageElement.textContent=text;
 messageElement.className="message show "+type;
}
function clearMessage(){
 messageElement.textContent="";
 messageElement.className="message";
}
function openModal(){
 clearMessage();
 backdrop.classList.add("open");
 if(editingId===null) nameInput.focus();
}
function closeModal(){
 backdrop.classList.remove("open");
}
$("addButton").addEventListener("click",()=>{
 resetForm();
 openModal();
});
$("closeModal").addEventListener("click",closeModal);
backdrop.addEventListener("click",e=>{
 if(e.target===backdrop) closeModal();
});
document.addEventListener("keydown",e=>{
 if(e.key==="Escape") closeModal();
});

async function api(action,data={}){
 const response=await fetch(API_URL,{
  method:"POST",
  headers:{
   "Content-Type":"application/json",
   "apikey":SUPABASE_PUBLISHABLE_KEY
  },
  body:JSON.stringify({action,...data})
 });
 const text=await response.text();
 let result;
 try{result=JSON.parse(text);}
 catch{
  throw new Error(`A szerver nem JSON-választ küldött (HTTP ${response.status}). Ellenőrizd az Edge Function beállításait.`);
 }
 if(!response.ok||result.error) throw new Error(result.error||`Szerverhiba: HTTP ${response.status}`);
 return result.data;
}

function dayDifference(dateString){
 const now=new Date();
 const today=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
 const [y,m,d]=dateString.split("-").map(Number);
 return Math.round((Date.UTC(y,m-1,d)-today)/86400000);
}
function formatDate(s){
 const [y,m,d]=s.split("-");
 return `${y}. ${m}. ${d}.`;
}
function getStatus(p){
 const days=dayDifference(p.expiry_date);
 if(days<0)return{cls:"expired",text:`${Math.abs(days)} napja lejárt`};
 if(days<=10)return{cls:"soon-blue",text:days===0?"Ma jár le":`${days} nap van hátra`};
 if(days<=30)return{cls:"soon-green",text:`${days} nap van hátra`};
 return{cls:"normal",text:`${days} nap van hátra`};
}
function sorted(items){
 return [...items].sort((a,b)=>
  a.expiry_date.localeCompare(b.expiry_date)||
  Number(a.product_number)-Number(b.product_number)
 );
}
function makeButton(label,cls,fn){
 const b=document.createElement("button");
 b.type="button";b.className=cls;b.textContent=label;b.addEventListener("click",fn);
 return b;
}
function render(highlightId=null){
 const query=searchInput.value.trim().toLocaleLowerCase("hu");
 const filtered=sorted(products).filter(p=>
  [p.name,p.category,String(p.product_number)].join(" ").toLocaleLowerCase("hu").includes(query)
 );
 countElement.textContent=query?`${filtered.length} / ${products.length} termék`:`${products.length} termék`;
 productList.replaceChildren();
 if(!filtered.length){
  const empty=document.createElement("div");empty.className="empty";
  empty.textContent=query?"Nincs találat.":"Még nincs termék. Nyomd meg a + gombot!";
  productList.appendChild(empty);return;
 }
 for(const p of filtered){
  const status=getStatus(p),card=document.createElement("article");
  card.className="product "+status.cls;
  card.dataset.productId=String(p.id);
  const number=document.createElement("div");number.className="number";number.textContent=p.product_number;
  const info=document.createElement("div");info.className="product-info";
  const name=document.createElement("div");name.className="product-name";name.textContent=p.name;
  const meta=document.createElement("div");meta.className="product-meta";
  const cat=document.createElement("span");cat.textContent=p.category;
  const date=document.createElement("span");date.textContent=formatDate(p.expiry_date);
  meta.append(cat,date);
  const statusText=document.createElement("div");statusText.className="product-status";statusText.textContent=status.text;
  info.append(name,meta,statusText);
  const actions=document.createElement("div");actions.className="product-actions";
  actions.append(
   makeButton("Szerkesztés","secondary",()=>startEdit(p)),
   makeButton("Törlés","danger",()=>deleteProduct(p))
  );
  card.append(number,info,actions);productList.appendChild(card);
 }
 if(highlightId!==null){
  const card=productList.querySelector(`[data-product-id="${CSS.escape(String(highlightId))}"]`);
  if(card){
   card.classList.add("just-saved");
   card.scrollIntoView({behavior:"smooth",block:"center"});
   setTimeout(()=>card.classList.remove("just-saved"),2600);
  }
 }
}
async function loadProducts(highlightId=null){
 try{
  products=await api("list")||[];
  render(highlightId);clearMessage();
 }catch(error){
  productList.replaceChildren();
  const empty=document.createElement("div");empty.className="empty";
  empty.textContent="A terméklista nem tölthető be.";
  productList.appendChild(empty);countElement.textContent="Hiba";
  showMessage(error.message);
 }
}
function startEdit(p){
 editingId=p.id;nameInput.value=p.name;categoryInput.value=p.category;expiryInput.value=p.expiry_date;
 formTitle.textContent=`${p.product_number}. termék szerkesztése`;
 saveButton.textContent="Módosítás mentése";cancelEdit.style.display="block";
 openModal();
}
function resetForm(){
 editingId=null;form.reset();categoryInput.value=categories[0];
 formTitle.textContent="Új termék";saveButton.textContent="Termék hozzáadása";
 cancelEdit.style.display="none";
}
cancelEdit.addEventListener("click",()=>{resetForm();closeModal();clearMessage();});

form.addEventListener("submit",async e=>{
 e.preventDefault();if(busy)return;clearMessage();
 const name=nameInput.value.trim(),category=categoryInput.value,expiry_date=expiryInput.value;
 if(!name||name.length>120||!categories.includes(category)||!expiry_date){
  showMessage("Ellenőrizd a nevet, kategóriát és lejárati dátumot.");return;
 }
 const wasEditing=editingId!==null;
 const editedId=editingId;
 busy=true;saveButton.disabled=true;
 saveButton.textContent="Mentés…";
 try{
  let savedProduct;
  if(wasEditing){
   savedProduct=await api("update",{id:editedId,name,category,expiry_date});
  }else{
   savedProduct=await api("add",{name,category,expiry_date});
  }
  resetForm();closeModal();showMessage("Sikeresen elmentve.","success");
  await loadProducts(savedProduct?.id ?? (wasEditing ? editedId : null));
 }catch(error){showMessage(error.message);}
 finally{
  busy=false;saveButton.disabled=false;
  saveButton.textContent=editingId!==null?"Módosítás mentése":"Termék hozzáadása";
 }
});

async function deleteProduct(p){
 if(!confirm(`Biztosan törlöd?\n\n${p.product_number}. ${p.name}`))return;
 try{
  await api("delete",{id:p.id});
  showMessage("Termék törölve. A sorszám újra felhasználható.","success");
  await loadProducts();
 }catch(error){showMessage(error.message);}
}
searchInput.addEventListener("input",render);
loadProducts();
</script>
</body>
</html>
